<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в панель администратора — GeoPulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        .gradient-brand { background: linear-gradient(135deg, #4f46e5 0%, #a855f7 50%, #ec4899 100%); }
        .gradient-text {
            background: linear-gradient(135deg, #4f46e5 0%, #d946ef 50%, #f43f5e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 antialiased min-h-screen flex items-center justify-center p-4 selection:bg-indigo-500 selection:text-white relative overflow-hidden">

    <!-- Фоновые неоновые световые пятна -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-[128px]"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-pink-600/20 rounded-full blur-[128px]"></div>
    </div>

    <div class="relative z-10 w-full max-w-md bg-slate-900/80 border border-slate-800 rounded-3xl p-8 shadow-2xl backdrop-blur-xl">
        <div class="text-center mb-8">
            <div class="w-14 h-14 mx-auto rounded-2xl gradient-brand flex items-center justify-center text-white shadow-xl shadow-indigo-500/25 mb-4">
                <span class="font-black text-2xl">G</span>
            </div>
            <h1 class="text-2xl font-black tracking-tight text-white">Вход в панель управления</h1>
            <p class="text-xs text-slate-400 font-medium mt-1">GeoPulse SaaS Admin Access</p>
        </div>

        {% if error %}
        <div class="mb-6 p-4 rounded-xl text-xs font-bold bg-rose-500/15 border border-rose-500/30 text-rose-300 text-center">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form action="/admin/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1.5">Логин администратора</label>
                <input type="text" name="username" required autocomplete="username" placeholder="admin" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1.5">Пароль</label>
                <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••••••" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
            </div>

            <button type="submit" class="w-full gradient-brand hover:opacity-95 text-white font-black text-sm py-3.5 rounded-xl shadow-lg shadow-indigo-500/25 transition active:scale-95 mt-2">
                Войти в админку ➔
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-800 text-center">
            <a href="/" class="text-xs font-semibold text-slate-400 hover:text-white transition">← Вернуться на главную страницу</a>
        </div>
    </div>

</body>
</html>
