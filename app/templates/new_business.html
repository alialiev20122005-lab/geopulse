<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подключить заведение — GeoPulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen py-10 px-4">
    <div class="max-w-xl mx-auto">
        
        <!-- Верхняя шапка -->
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-2 text-slate-500 hover:text-slate-800 text-xs font-semibold mb-4 transition">
                ← Вернуться в панель
            </a>
            <div class="inline-flex items-center justify-center w-12 h-12 bg-amber-500 text-white rounded-2xl shadow-lg shadow-amber-500/20 mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900">Подключение нового заведения</h1>
            <p class="text-xs text-slate-500 mt-1">Создайте точку за 1 минуту: система сгенерирует QR-коды и свяжет с Telegram</p>
        </div>

        <!-- Форма -->
        <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-xl shadow-slate-200/60 border border-slate-100">
            <form action="/new" method="POST" class="space-y-4">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Название заведения *</label>
                    <input type="text" name="name" required placeholder="Например: Стоматология «Денталюкс»" class="w-full text-sm p-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-amber-500 focus:border-transparent outline-none transition">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Категория бизнеса</label>
                        <select name="category" class="w-full text-sm p-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-amber-500 focus:border-transparent outline-none transition bg-white">
                            <option value="Кафе / Ресторан">Кафе / Ресторан / Кофейня</option>
                            <option value="Салон красоты">Салон красоты / Барбершоп</option>
                            <option value="Автосервис">Автосервис / Автомойка</option>
                            <option value="Медицина">Стоматология / Клиника</option>
                            <option value="Отель">Отель / Гостиница</option>
                            <option value="Сфера услуг">Другая сфера услуг</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Короткий ID (латиницей) *</label>
                        <input type="text" name="id" required placeholder="dentalux" pattern="[a-zA-Z0-9_-]+" title="Только английские буквы, цифры и дефис" class="w-full text-sm p-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-amber-500 focus:border-transparent outline-none transition font-mono">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Адрес заведения *</label>
                    <input type="text" name="address" required placeholder="г. Москва, ул. Ленина, 15" class="w-full text-sm p-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-amber-500 focus:border-transparent outline-none transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Ссылка на Яндекс.Карты (для 5 звезд) *</label>
                    <input type="url" name="yandex_maps_url" required placeholder="https://yandex.ru/maps/org/..." class="w-full text-sm p-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-amber-500 focus:border-transparent outline-none transition">
                    <p class="text-[11px] text-slate-400 mt-1">Сюда будут направляться гости, поставившие 4 или 5 звезд</p>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-4 px-4 rounded-xl shadow-lg shadow-slate-900/10 text-sm transition active:scale-[0.98]">
                        🚀 Создать заведение и перейти к привязке Telegram
                    </button>
                </div>
            </form>
        </div>

    </div>
</body>
</html>
