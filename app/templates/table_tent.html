<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тейбл-тент для печати — {{ business.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            .card-print { box-shadow: none !important; border: 1px solid #e2e8f0 !important; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-6 flex flex-col items-center justify-center font-sans">

    <!-- Кнопка печати (скрывается при печати) -->
    <div class="no-print mb-6 flex gap-3">
        <button onclick="window.print()" class="bg-slate-900 hover:bg-slate-800 text-white font-semibold py-2.5 px-6 rounded-xl shadow-lg shadow-slate-900/10 flex items-center gap-2 text-sm transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
            Распечатать тейбл-тент (Ctrl + P)
        </button>
        <a href="/r/{{ business_id }}" target="_blank" class="bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-semibold py-2.5 px-4 rounded-xl text-sm transition flex items-center gap-2">
            Открыть экран клиента ↗
        </a>
    </div>

    <!-- Тейбл-тент (формат А6 / А5) -->
    <div class="card-print bg-white w-full max-w-[340px] rounded-3xl p-8 text-center shadow-2xl border border-slate-200/80 flex flex-col items-center relative overflow-hidden">
        
        <!-- Верхний бейдж -->
        <div class="w-12 h-12 bg-amber-500 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-amber-500/20 mb-4">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
            </svg>
        </div>

        <h1 class="text-xl font-extrabold tracking-tight text-slate-900 mb-1">{{ business.name }}</h1>
        {% if table_number %}
        <div class="inline-block bg-slate-900 text-white font-black text-xs px-3 py-1 rounded-full uppercase tracking-wider mb-2">
            Столик №{{ table_number }}
        </div>
        {% endif %}
        <p class="text-xs font-semibold uppercase tracking-wider text-amber-600 mb-5">Контроль качества обслуживания</p>

        <!-- Рамка QR-кода -->
        <div class="p-3 bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl mb-5 shadow-inner">
            <img src="/api/qr/{{ business_id }}{% if table_number %}?table={{ table_number }}{% endif %}" alt="QR Code" class="w-48 h-48 rounded-xl object-contain">
        </div>

        <!-- Поясняющий текст -->
        <div class="space-y-2 text-xs text-slate-600">
            <p class="font-bold text-slate-800 text-sm">Наведите камеру телефона</p>
            <div class="flex items-center justify-center gap-1.5 text-emerald-600 font-medium">
                <span>●</span>
                <span>Довольны? Оставьте отзыв</span>
            </div>
            <div class="flex items-center justify-center gap-1.5 text-amber-700 font-medium">
                <span>●</span>
                <span>Есть замечания? Напишите директору</span>
            </div>
        </div>

        <!-- Нижний микро-футер -->
        <div class="mt-6 pt-4 border-t border-slate-100 w-full flex items-center justify-center gap-2 text-[10px] text-slate-400">
            <span>Каждое обращение читает руководство</span>
        </div>
    </div>

</body>
</html>
