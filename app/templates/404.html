<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена | GeoPulse</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="64x64" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/css/styles.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gradient-btn {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex flex-col justify-between p-4 selection:bg-indigo-500 selection:text-white">

    <header class="w-full max-w-xl mx-auto pt-8 pb-4 text-center">
        <a href="/" class="inline-flex items-center gap-2.5 group">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 p-0.5 shadow-lg shadow-indigo-500/25">
                <div class="w-full h-full bg-[#0b0f19] rounded-[14px] flex items-center justify-center">
                    <span class="text-base font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-pink-400">GP</span>
                </div>
            </div>
            <span class="text-xl font-extrabold tracking-tight text-white group-hover:text-indigo-400 transition">GeoPulse</span>
        </a>
    </header>

    <main class="w-full max-w-md mx-auto my-auto text-center px-4">
        <div class="relative mb-6">
            <div class="w-24 h-24 mx-auto rounded-3xl bg-slate-900 border border-slate-800 flex items-center justify-center shadow-2xl shadow-indigo-500/10">
                <svg class="w-12 h-12 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
            </div>
            <span class="absolute -top-2 -right-2 bg-rose-500/20 text-rose-400 border border-rose-500/30 text-[11px] font-black px-2 py-0.5 rounded-full">404</span>
        </div>

        <h1 class="text-2xl sm:text-3xl font-extrabold text-white mb-2">
            Страница не найдена
        </h1>
        <p class="text-sm text-slate-400 mb-8 leading-relaxed max-w-sm mx-auto">
            {{ detail or "Возможно, QR-код устарел, заведение было переименовано или ссылка содержит опечатку." }}
        </p>

        <div class="space-y-3">
            <a href="/" class="w-full inline-flex items-center justify-center gap-2 gradient-btn hover:opacity-95 text-white font-bold py-3.5 px-6 rounded-2xl shadow-xl shadow-indigo-500/20 text-sm transition active:scale-[0.98]">
                <span>← Вернуться на главную</span>
            </a>
            <a href="/#connect" class="w-full inline-flex items-center justify-center gap-2 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 font-semibold py-3.5 px-6 rounded-2xl text-xs transition">
                <span>Подключить своё заведение к GeoPulse</span>
            </a>
        </div>
    </main>

    <footer class="w-full max-w-xl mx-auto pb-6 text-center text-xs text-slate-500">
        GeoPulse • Платформа защиты репутации заведений в геосервисах
    </footer>

</body>
</html>
